<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
</head>

<body>

<h2>Camera Dashboard</h2>

<!-- Live Webcam -->
<video id="video" width="400" height="300" autoplay></video>
<br><br>

<!-- Buttons -->
<button id="captureBtn">Capture</button>
<button id="retakeBtn">Retake</button>
<button id="saveBtn">Save</button>
<button onclick="logout()">Logout</button>

<br><br>

<!-- Where the captured image shows -->
<canvas id="canvas" width="400" height="300"></canvas>

<script>
// ==========================
// Constants
// ==========================
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const KEY = "storedImage"; // localStorage key


// ==========================
// 1. Start Camera
// ==========================
navigator.mediaDevices.getUserMedia({ video: true })
.then(stream => {
    video.srcObject = stream;
})
.catch(err => {
    console.log("Camera error:", err);
});


// ==========================
// 2. Load previous image (if exists)
// ==========================
function loadImage() {
    const data = localStorage.getItem(KEY);

    if (data) {
        const img = new Image();
        img.onload = function () {
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        };
        img.src = data;
    }
}

loadImage(); // load automatically on page open



// ==========================
// 3. Capture image (but not save yet)
// ==========================
document.getElementById("captureBtn").onclick = function () {
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    alert("Image captured! Click Save to store it.");
};



// ==========================
// 4. Retake → remove current image
// ==========================
document.getElementById("retakeBtn").onclick = function () {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    localStorage.removeItem(KEY);
    alert("Old image removed. You can capture again.");
};



// ==========================
// 5. Save image → store in localStorage
// ==========================
document.getElementById("saveBtn").onclick = function () {
    const dataURL = canvas.toDataURL();
    localStorage.setItem(KEY, dataURL);

    alert("Image saved successfully!");
};



// ==========================
// 6. Logout → back to login page
// ==========================
function logout() {
    window.location.href = "index.html";
}
</script>

</body>
</html>
